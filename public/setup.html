<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KULT AD — Setup</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: #030712; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
    .card { width: 100%; max-width: 380px; background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 28px; }
    .brand { text-align: center; margin-bottom: 24px; }
    .brand h1 { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: 0.05em; }
    .brand h1 span { color: #a78bfa; }
    .brand p { color: #6b7280; font-size: 13px; margin-top: 4px; }
    .notice { background: #7c2d12; border: 1px solid #c2410c; color: #fdba74; border-radius: 8px; padding: 10px 14px; font-size: 12px; margin-bottom: 20px; line-height: 1.5; }
    label { display: block; font-size: 11px; color: #9ca3af; margin-bottom: 4px; margin-top: 14px; }
    input { width: 100%; background: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 9px 12px; font-size: 14px; color: #fff; outline: none; }
    input:focus { border-color: #7c3aed; }
    button { width: 100%; margin-top: 20px; background: #7c3aed; color: #fff; border: none; border-radius: 8px; padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #6d28d9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 14px; font-size: 13px; text-align: center; }
    .msg.ok { color: #4ade80; }
    .msg.err { color: #f87171; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h1><span>KULT</span> AD</h1>
      <p>First-time setup</p>
    </div>
    <div class="notice">
      ⚠️ This page creates the first admin account with no authentication required.
      Delete <code>setup.html</code> and <code>functions/api/auth/setup.js</code> after use.
    </div>
    <form id="form">
      <label>Username</label>
      <input name="username" type="text" required autocomplete="off" />
      <label>Display Name</label>
      <input name="display_name" type="text" required />
      <label>Email</label>
      <input name="email" type="email" required />
      <label>Password</label>
      <input name="password" type="password" required />
      <button type="submit" id="btn">Create Admin Account</button>
    </form>
    <div class="msg" id="msg"></div>
  </div>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const btn = document.getElementById('btn')
      const msg = document.getElementById('msg')
      btn.disabled = true
      btn.textContent = 'Creating…'
      msg.textContent = ''
      const data = Object.fromEntries(new FormData(e.target))
      try {
        const res = await fetch('/api/auth/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        })
        const json = await res.json()
        if (res.ok) {
          msg.className = 'msg ok'
          msg.textContent = '✓ Account created! You can now log in at /. Delete this page.'
          e.target.reset()
        } else {
          msg.className = 'msg err'
          msg.textContent = json.error || 'Something went wrong'
          btn.disabled = false
          btn.textContent = 'Create Admin Account'
        }
      } catch {
        msg.className = 'msg err'
        msg.textContent = 'Network error'
        btn.disabled = false
        btn.textContent = 'Create Admin Account'
      }
    })
  </script>
</body>
</html>
